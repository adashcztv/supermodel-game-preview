# Native v38, v39 and v40 keep exact bytes and separate lossless wire representations.
# Only an unweighted, explicit br token selects .br. br;q=0 and weighted/unknown
# forms use the incumbent nginx gzip/identity negotiation.
map $http_accept_encoding $sm_brotli_suffix {
    default "";
    ~*(^|,)\s*br\s*(,|$) ".br";
}
map $sm_brotli_suffix $sm_brotli_encoding {
    default "";
    ".br" "br";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-SM-Release "core-v23/native-v40" always;
    gzip off;
    gzip_static on;
    gzip_vary on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /assets/combat/runtime.json {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location = /combat/index.html {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    # Current native sidecars; previous client paths keep the original rules.
    location ~ ^/assets/combat/Build/combat-build-v(?:38|39|40)\.data$ {
        types { }
        default_type application/octet-stream;
        # No raw fallback with a br header: absent selected representations fail.
        try_files $uri$sm_brotli_suffix =404;
        add_header Content-Encoding $sm_brotli_encoding;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ ^/assets/combat/Build/combat-build-v(?:38|39|40)\.wasm$ {
        types { }
        default_type application/wasm;
        # No raw fallback with a br header: absent selected representations fail.
        try_files $uri$sm_brotli_suffix =404;
        add_header Content-Encoding $sm_brotli_encoding;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ ^/assets/combat/Build/combat-build-v(?:38|39|40)\.(?:framework|loader)\.js$ {
        types { }
        default_type application/javascript;
        # No raw fallback with a br header: absent selected representations fail.
        try_files $uri$sm_brotli_suffix =404;
        add_header Content-Encoding $sm_brotli_encoding;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # Frozen build IDs and content-hashed entry assets are immutable. Their raw
    # files remain available for old clients and identity/Range verification.
    location ~ ^/assets/combat/Build/combat-build-v[0-9]+\.(?:data|wasm|framework\.js|loader\.js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|svg)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location = /assets/unity/runtime.json {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
